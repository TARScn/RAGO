# Roadside Distance-guided Uncertainty-aware CoAlign (RDU-CoAlign).
name: dairv2x_rago_pointpillar_rdu_coalign_withnoise
data_dir: "dataset/my_dair_v2x/v2x_c/cooperative-vehicle-infrastructure"
root_dir: "dataset/my_dair_v2x/v2x_c/cooperative-vehicle-infrastructure/train.json"
validate_dir: "dataset/my_dair_v2x/v2x_c/cooperative-vehicle-infrastructure/val.json"
test_dir: "dataset/my_dair_v2x/v2x_c/cooperative-vehicle-infrastructure/val.json"

noise_setting:
  add_noise: True
  args:
    pos_std: 0.2
    rot_std: 0.2
    pos_mean: 0
    rot_mean: 0

yaml_parser: "load_point_pillar_params"
train_params:
  batch_size: &batch_size 4
  epoches: 30
  eval_freq: 2
  save_freq: 3
  max_cav: &max_cav 5

input_source: ['lidar']
label_type: 'lidar'

comm_range: 100

fusion:
  core_method: 'intermediate'
  dataset: 'dairv2x'
  args:
    proj_first: false

box_align:
  train_result: "opencood/logs/coalign_precalc/dairv2x/train/stage1_boxes.json"
  val_result: "opencood/logs/coalign_precalc/dairv2x/val/stage1_boxes.json"
  test_result: "opencood/logs/coalign_precalc/dairv2x/test/stage1_boxes.json"
  args:
    use_uncertainty: true
    landmark_SE2: true
    adaptive_landmark: false
    normalize_uncertainty: false
    abandon_hard_cases: true
    drop_hard_boxes: true

preprocess:
  core_method: 'SpVoxelPreprocessor'
  args:
    voxel_size: &voxel_size [0.4, 0.4, 5]
    max_points_per_voxel: 32
    max_voxel_train: 32000
    max_voxel_test: 70000
  cav_lidar_range: &cav_lidar [-100.8, -40, -3.5, 100.8, 40, 1.5]

data_augment:
  - NAME: random_world_flip
    ALONG_AXIS_LIST: [ 'x' ]

  - NAME: random_world_rotation
    WORLD_ROT_ANGLE: [ -0.78539816, 0.78539816 ]

  - NAME: random_world_scaling
    WORLD_SCALE_RANGE: [ 0.95, 1.05 ]

postprocess:
  core_method: 'VoxelPostprocessor'
  gt_range: *cav_lidar
  anchor_args:
    cav_lidar_range: *cav_lidar
    l: 4.5
    w: 2
    h: 1.56
    r: &anchor_yaw [0, 90]
    feature_stride: 2
    num: &anchor_num 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.20
  order: 'hwl'
  max_num: 100
  nms_thresh: 0.15
  dir_args: &dir_args
    dir_offset: 0.7853
    num_bins: 2
    anchor_yaw: *anchor_yaw

model:
  core_method: point_pillar_rdu_coalign
  args:
    voxel_size: *voxel_size
    lidar_range: *cav_lidar
    anchor_number: *anchor_num

    pillar_vfe:
      use_norm: true
      with_distance: false
      use_absolute_xyz: true
      num_filters: [64]
    point_pillar_scatter:
      num_features: 64

    base_bev_backbone:
      layer_nums: [3, 5, 8]
      layer_strides: [2, 2, 2]
      num_filters: [64, 128, 256]
      upsample_strides: [1, 2, 4]
      num_upsample_filter: [128, 128, 128]

    fusion_method: att
    att:
      feat_dim: [64, 128, 256]

    hybrid_v2xvit_deform:
      level: 2
      gate_init: -4.0
      fusion:
        transformer:
          encoder:
            num_blocks: 1
            depth: 1
            use_roi_mask: true
            cav_att_config:
              dim: 256
              use_hetero: true
              use_RTE: false
              RTE_ratio: 0
              heads: 8
              dim_head: 32
              dropout: 0.1
            pwindow_att_config:
              dim: 256
              heads: [4, 4, 4]
              dim_head: [16, 16, 16]
              dropout: 0.1
              window_size: [1, 5, 11]
              relative_pos_embedding: true
              fusion_method: 'split_attn'
            feed_forward:
              mlp_dim: 256
              dropout: 0.1
            sttf:
              voxel_size: *voxel_size
              downsample_rate: 8
        deformable:
          feature_dim: 256
          n_heads: 4
          n_points: 4
          ffn_dim: 512
          dropout: 0.1

    rsu_distance_guidance:
      rsu_index: -1
      level: 2
      range_start: 40.0
      range_end: 90.0
      center_x: 0.0
      center_y: 0.0
      min_alpha: 0.0
      max_alpha: 0.7
      bias_init: -2.0
      alpha_scale_init: 1.5

    shrink_header:
      kernal_size: [ 3 ]
      stride: [ 1 ]
      padding: [ 1 ]
      dim: [ 256 ]
      input_dim: 384

    dir_args: *dir_args

loss:
  core_method: point_pillar_loss
  args:
    pos_cls_weight: 2.0
    cls:
      type: 'SigmoidFocalLoss'
      alpha: 0.25
      gamma: 2.0
      weight: 2.0
    reg:
      type: 'WeightedSmoothL1Loss'
      sigma: 3.0
      codewise: true
      weight: 2.0
    dir:
      type: 'WeightedSoftmaxClassificationLoss'
      weight: 0.2
      args: *dir_args

optimizer:
  core_method: Adam
  lr: 0.002
  args:
    eps: 1e-10
    weight_decay: 1e-4

lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size: [10, 15]
